schedule:
  cleanup:
    cron: "0 0 0 1 1 *"

spring:
  datasource:
    url: jdbc:postgresql://${DB_URL}:5434/${DB_NAME:learning-management-system}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}


  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true